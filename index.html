<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Audio</title>

    <!-- PWA / iPhone -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Audio">
    <link rel="apple-touch-icon" href="icon.JPEG">

    <style>
        :root {
            --bg-deep: #1a1a2e;
            --bg-card: #26264a;
            --mauve: #b39ddb;
            --rose: #f8bbd0;
            --bleu-ciel: #90caf9;
            --turquoise: #80deea;
            --texte: #f0eefb;
            --texte-doux: #b8b4d4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; min-height: 100vh; min-height: 100dvh; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #1a1a2e 0%, #2a1f45 50%, #1f2a3e 100%);
            background-attachment: fixed;
            color: var(--texte);
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 12px 0;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--mauve), var(--rose), var(--bleu-ciel), var(--turquoise));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .card {
            background: rgba(38, 38, 74, 0.85);
            backdrop-filter: blur(10px);
            border: 1.5px solid rgba(179, 157, 219, 0.35);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            margin-top: 24px;
        }

        .module-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 20px;
            border-radius: 14px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
            text-decoration: none;
            color: #1a1a2e;
            font-family: inherit;
        }

        .module-btn:last-child {
            margin-bottom: 0;
        }

        .module-btn:hover {
            transform: translateY(-2px);
        }

        .module-btn-cleaner {
            background: linear-gradient(135deg, var(--mauve), var(--rose));
            border-color: var(--rose);
            box-shadow: 0 6px 16px rgba(248, 187, 208, 0.3);
        }

        .module-btn-cleaner:hover {
            box-shadow: 0 8px 22px rgba(248, 187, 208, 0.5);
        }

        .module-btn-detector {
            background: linear-gradient(135deg, var(--bleu-ciel), var(--turquoise));
            border-color: var(--turquoise);
            box-shadow: 0 6px 16px rgba(128, 222, 234, 0.3);
        }

        .module-btn-detector:hover {
            box-shadow: 0 8px 22px rgba(128, 222, 234, 0.5);
        }

        .module-icon {
            font-size: 2rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .module-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .module-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .module-desc {
            font-size: 0.8rem;
            opacity: 0.75;
            font-weight: 500;
        }

        .note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--texte-doux);
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Audio</h1>

    <div class="card">
        <a href="cleaner.html" class="module-btn module-btn-cleaner">
            <span class="module-icon">🎛️</span>
            <span class="module-text">
                <span class="module-title">Nettoyer un audio</span>
                <span class="module-desc">Suppression des watermarks IA</span>
            </span>
        </a>

        <a href="detector.html" class="module-btn module-btn-detector">
            <span class="module-icon">🔬</span>
            <span class="module-text">
                <span class="module-title">Analyser un audio</span>
                <span class="module-desc">Détection musique / voix IA</span>
            </span>
        </a>
    </div>

    <p class="note">Application personnelle — usage local<br>Les fichiers ne sont jamais conservés.</p>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker enregistré :', reg.scope))
                .catch(err => console.error('Erreur Service Worker :', err));
        });
    }
</script>

</body>
</html>
